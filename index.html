<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0E1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>八万·蚊消令</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0E1A;--surface:#141928;--surface-elevated:#1E2539;
  --brand:#F59E0B;--success:#10B981;--info:#3B82F6;--danger:#EF4444;
  --text-primary:#F8FAFC;--text-secondary:#94A3B8;--text-muted:#475569;
  --border:#1E2539;
  --radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-full:9999px;
  --gold:#FFD700;--silver:#C0C0C0;--bronze:#CD7F32;--legend:#FF6B35;
}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text-primary);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.page{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 80px}
.page.active{display:block}
/* Splash / Login */
.splash{background:var(--bg);color:var(--text-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:32px;text-align:center}
.splash .logo{font-size:64px;margin-bottom:16px;line-height:1}
.splash h1{font-size:28px;font-weight:800;color:var(--brand);margin-bottom:8px;letter-spacing:-.5px}
.splash .sub{font-size:14px;color:var(--text-secondary);margin-bottom:32px}
.splash .field{width:100%;margin-bottom:14px;text-align:left}
.splash .field label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px}
.splash .field input{width:100%;padding:13px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-primary);font-size:15px;outline:none;transition:border .2s}
.splash .field input:focus{border-color:var(--brand)}
.btn{display:block;width:100%;padding:14px;border-radius:var(--radius-sm);border:none;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;text-align:center;min-height:48px}
.btn:active{opacity:.85;transform:scale(.98)}
.btn-brand{background:var(--brand);color:#000}
.btn-secondary{background:var(--surface-elevated);color:var(--text-primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:8px 16px;font-size:13px;min-height:36px}
/* Nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--border);display:flex;padding:4px 0 env(safe-area-inset-bottom,6px);z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0;color:var(--text-muted);font-size:9px;cursor:pointer;transition:color .2s;border:none;background:none;min-height:48px;-webkit-tap-highlight-color:transparent}
.nav-item.active{color:var(--brand)}
.nav-item .icon{font-size:20px;margin-bottom:1px}
/* Cards */
.card{background:var(--surface);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.card-highlight{border-color:var(--brand)}
/* Flex */
.flex-row{display:flex;gap:8px}
.flex-row>*{flex:1}
/* Text helpers */
.text-brand{color:var(--brand)}.text-success{color:var(--success)}.text-info{color:var(--info)}.text-danger{color:var(--danger)}.text-muted{color:var(--text-muted)}.text-secondary{color:var(--text-secondary)}
/* Big number */
.big-number{font-size:96px;font-weight:900;font-family:'Courier New',Courier,monospace;color:var(--brand);text-align:center;line-height:1;user-select:none}
.big-number.pop{animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
/* Stat cards */
.stat-card{background:var(--surface-elevated);border-radius:var(--radius-md);padding:12px 8px;text-align:center;border:1px solid var(--border)}
.stat-card .num{font-size:22px;font-weight:800;font-family:'Courier New',monospace;color:var(--text-primary)}
.stat-card .lbl{font-size:11px;color:var(--text-muted);margin-top:2px}
/* Device status */
.device-status{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface);border-radius:var(--radius-md);border:1px solid var(--border);margin-bottom:16px}
.status-dot{width:10px;height:10px;border-radius:50%;background:var(--text-muted);flex-shrink:0}
.status-dot.online{background:var(--success);box-shadow:0 0 8px rgba(16,185,129,.4)}
/* Contained button */
.btn-contained{display:block;width:100%;padding:16px;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center;min-height:52px}
.btn-contained:active{transform:scale(.98)}
.btn-brand-contained{background:var(--brand);color:#000}
.btn-danger-contained{background:var(--danger);color:#fff}
/* Leaderboard */
.leaderboard-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:var(--radius-md);margin-bottom:6px;border:1px solid var(--border)}
.leaderboard-item.my-rank{border-color:var(--brand);background:var(--surface-elevated)}
.rank-medal{font-size:20px;width:32px;text-align:center;flex-shrink:0}
.rank-num{font-weight:800;font-size:15px;font-family:'Courier New',monospace;color:var(--text-muted)}
.rank-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#000;flex-shrink:0}
.rank-name{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-score{font-family:'Courier New',monospace;font-size:18px;font-weight:800;color:var(--brand);flex-shrink:0}
/* Badges */
/* ── Badge V1.1 ── */
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge-card{background:var(--surface);border-radius:var(--radius-md);padding:14px 10px;text-align:center;border:1px solid var(--border);cursor:pointer;transition:transform .15s,opacity .2s;position:relative}
.badge-card:active{transform:scale(.96)}
.badge-card.locked{opacity:.45;cursor:default}
.badge-card.locked .badge-icon{filter:grayscale(1)}
.badge-icon{font-size:34px;margin-bottom:5px;line-height:1}
.badge-name{font-size:12px;font-weight:700;margin-bottom:4px}
.badge-cond{font-size:10px;color:var(--text-muted);margin-top:3px;line-height:1.4}
.badge-progress-wrap{margin:6px 0 2px;height:4px;background:var(--surface-elevated);border-radius:4px;overflow:hidden}
.badge-progress-bar{height:100%;border-radius:4px;transition:width .4s}
.badge-progress-bar.tier-bronze{background:var(--bronze)}
.badge-progress-bar.tier-silver{background:var(--silver)}
.badge-progress-bar.tier-gold{background:var(--gold)}
.badge-progress-bar.tier-legend{background:linear-gradient(90deg,var(--legend),var(--brand))}
.badge-progress-label{font-size:9px;color:var(--text-muted);margin-bottom:2px}
/* 全集专属 */
.badge-all-star{text-align:center;padding:14px;background:linear-gradient(135deg,rgba(255,215,0,.15),rgba(255,107,53,.1));border:1px solid rgba(255,215,0,.3);border-radius:var(--radius-md);margin-bottom:12px}
.badge-all-star .as-icon{font-size:32px;margin-bottom:4px}
.badge-all-star .as-title{font-size:14px;font-weight:800;color:var(--gold)}
.badge-all-star .as-sub{font-size:11px;color:var(--text-secondary);margin-top:2px}
/* 勋章计数 */
.badge-count-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border-radius:var(--radius-md);margin-bottom:10px;border:1px solid var(--border)}
.badge-count-bar .bcb-left{font-size:13px;color:var(--text-secondary)}
.badge-count-bar .bcb-right{font-size:15px;font-weight:800;color:var(--brand);font-family:'Courier New',monospace}
/* 解锁弹窗动画 */
@keyframes badgeUnlockPop{0%{transform:scale(.4) rotate(-15deg);opacity:0}60%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.badge-unlock-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:var(--surface-elevated);border:2px solid var(--gold);border-radius:var(--radius-lg);padding:28px 24px;text-align:center;max-width:280px;width:90%;box-shadow:0 0 40px rgba(255,215,0,.3);animation:badgeUnlockPop .5s cubic-bezier(.175,.885,.32,1.275) both}
.badge-unlock-overlay{position:fixed;inset:0;z-index:199;background:rgba(0,0,0,.7)}
.badge-unlock-icon{font-size:52px;display:block;margin-bottom:10px}
.badge-unlock-title{font-size:18px;font-weight:800;color:var(--gold);margin-bottom:4px}
.badge-unlock-name{font-size:14px;color:var(--text-primary);margin-bottom:8px}
.badge-unlock-tier{display:inline-block;padding:3px 12px;border-radius:var(--radius-full);font-size:11px;font-weight:700;margin-bottom:14px}
.badge-unlock-btn{display:block;width:100%;padding:11px;background:var(--brand);color:#000;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer}

.tag{display:inline-block;padding:3px 10px;border-radius:var(--radius-full);font-size:10px;font-weight:700}
.tag-bronze{background:rgba(205,127,50,.15);color:var(--bronze)}
.tag-silver{background:rgba(192,192,192,.15);color:var(--silver)}
.tag-gold{background:rgba(255,215,0,.15);color:var(--gold)}
.tag-legend{background:rgba(255,107,53,.15);color:var(--legend)}
/* Profile */
.profile-header{text-align:center;margin-bottom:20px}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#000;margin:0 auto 12px}
.profile-name{font-size:20px;font-weight:700;margin-bottom:6px}
.profile-level{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;background:var(--surface-elevated);border-radius:var(--radius-full);font-size:13px;font-weight:700;color:var(--brand);border:1px solid var(--border)}
.profile-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.profile-stat{background:var(--surface);border-radius:var(--radius-md);padding:12px 6px;text-align:center;border:1px solid var(--border)}
.profile-stat .pval{font-size:17px;font-weight:800;font-family:'Courier New',monospace;color:var(--text-primary)}
.profile-stat .plbl{font-size:10px;color:var(--text-muted);margin-top:2px}
.session-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface);border-radius:var(--radius-sm);margin-bottom:4px}
.session-date{font-size:12px;color:var(--text-muted)}
.session-kills{font-family:'Courier New',monospace;font-size:15px;font-weight:700;color:var(--brand)}
.menu-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border-radius:var(--radius-md);margin-bottom:6px;cursor:pointer;border:1px solid var(--border);min-height:48px}
.menu-item:active{opacity:.8}
.menu-label{font-size:15px}
.menu-arrow{font-size:16px;color:var(--text-muted)}
/* Season tabs */
.season-tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--surface);border-radius:var(--radius-sm);padding:4px}
.season-tab{flex:1;text-align:center;padding:8px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text-muted);transition:all .2s}
.season-tab.active{background:var(--brand);color:#000}
/* Scan */
.scan-btn{width:100%;padding:14px;border-radius:var(--radius-sm);border:2px dashed var(--border);background:transparent;color:var(--text-secondary);font-size:16px;cursor:pointer;transition:all .2s;min-height:52px}
.scan-btn:active{border-color:var(--brand);color:var(--brand)}
.radar-wrap{text-align:center;padding:28px 0}
.radar{display:inline-block;width:60px;height:60px;border:3px solid var(--brand);border-radius:50%;animation:radar-pulse 1.2s ease-out infinite;position:relative}
.radar::after{content:'';position:absolute;inset:8px;border-radius:50%;border:2px solid var(--brand);opacity:.6;animation:radar-pulse 1.2s ease-out .3s infinite}
@keyframes radar-pulse{0%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}
.scan-device{padding:12px 14px;background:var(--surface);border-radius:var(--radius-md);margin-bottom:6px;display:flex;align-items:center;border:1px solid var(--border)}
.scan-device .dev-name{font-size:14px;font-weight:600;flex:1}
.scan-device .dev-rssi{font-size:12px;color:var(--text-muted);margin-right:12px}
.scan-device .bind-btn{padding:7px 18px;border-radius:var(--radius-sm);background:var(--brand);color:#000;border:none;font-size:12px;font-weight:700;cursor:pointer}
.scan-device .bind-btn:active{opacity:.8}
/* Kill notification */
.kill-log{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:150;pointer-events:none}
.kill-notify{background:var(--success);color:#fff;font-size:22px;font-weight:900;padding:6px 20px;border-radius:var(--radius-full);opacity:0;transform:translateY(-16px);animation:kill-in .3s ease-out forwards,.3s ease-in 1.2s kill-out forwards;font-family:'Courier New',monospace;white-space:nowrap}
@keyframes kill-in{to{opacity:1;transform:translateY(0)}}
@keyframes kill-out{to{opacity:0;transform:translateY(-16px)}}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:24px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--surface-elevated);border-radius:var(--radius-lg);padding:24px;text-align:center;max-width:300px;width:100%;border:1px solid var(--border)}
.modal-box .modal-icon{font-size:48px;margin-bottom:12px;line-height:1}
.modal-box h3{font-size:18px;margin-bottom:6px}
.modal-box p{font-size:13px;color:var(--text-secondary);margin-bottom:4px}
.modal-close{margin-top:16px;padding:10px 32px;border-radius:var(--radius-sm);background:var(--brand);color:#000;border:none;font-size:14px;font-weight:700;cursor:pointer}
.modal-close:active{opacity:.8}
/* BLE pulse */
.ble-pulse{animation:ble-blink 2s ease-in-out infinite}
@keyframes ble-blink{0%,100%{opacity:1}50%{opacity:.4}}
/* Section title */
.section-title{font-size:14px;font-weight:700;color:var(--text-secondary);margin-bottom:8px}
/* Game */
.game-hud{display:flex;gap:10px;margin-bottom:12px}
.game-hud-item{flex:1;background:var(--surface);border-radius:var(--radius-md);padding:12px 8px;text-align:center;border:1px solid var(--border)}
.game-hud-item .gh-val{font-size:30px;font-weight:900;font-family:'Courier New',monospace;line-height:1}
.game-hud-item .gh-lbl{font-size:10px;color:var(--text-muted);margin-top:4px}
.game-hud-item .gh-val.urgent{color:var(--danger);animation:game-pulse .4s ease-in-out infinite}
@keyframes game-pulse{0%,100%{opacity:1}50%{opacity:.3}}
.game-board{position:relative;width:100%;height:380px;background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;border:2px solid var(--border);cursor:crosshair;touch-action:none;margin-bottom:12px}
.game-board.playing{border-color:var(--brand);box-shadow:0 0 20px rgba(245,158,11,.1)}
.game-mosq{position:absolute;font-size:38px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;z-index:10;line-height:1;animation:mosq-in .25s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.game-mosq:active{transform:scale(.25)!important}
.game-mosq.killed{animation:mosq-die .3s ease-out forwards!important;pointer-events:none}
@keyframes mosq-in{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes mosq-die{0%{transform:scale(1);opacity:1}40%{transform:scale(1.5);opacity:.5}100%{transform:scale(0) rotate(60deg);opacity:0}}
.game-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,14,26,.88);z-index:20;border-radius:var(--radius-lg)}
.game-overlay .go-icon{font-size:56px;line-height:1;margin-bottom:10px}
.game-overlay .go-text{font-size:14px;color:var(--text-secondary);margin-bottom:6px}
.game-overlay .go-big{font-size:48px;font-weight:900;font-family:'Courier New',monospace;color:var(--brand);line-height:1}
.game-kill-fx{position:absolute;font-size:16px;font-weight:900;color:var(--success);pointer-events:none;z-index:30;animation:kill-fx-up .7s ease-out forwards;text-shadow:0 0 8px rgba(16,185,129,.5)}
@keyframes kill-fx-up{0%{opacity:1;transform:translateY(0) scale(.8)}40%{opacity:1;transform:translateY(-30px) scale(1.1)}100%{opacity:0;transform:translateY(-60px) scale(.9)}}
.game-result{text-align:center;padding:8px 0}
.game-result .gr-score{font-size:64px;font-weight:900;font-family:'Courier New',monospace;color:var(--brand);line-height:1;animation:pop .4s ease-out}
.game-result .gr-label{font-size:14px;color:var(--text-secondary);margin-top:4px}
.game-history-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-radius:var(--radius-sm);margin-bottom:4px;border:1px solid var(--border)}
.game-history-item.my-score{border-color:var(--brand);background:var(--surface-elevated)}
.game-hist-num{font-family:'Courier New',monospace;font-size:16px;font-weight:800;color:var(--text-muted);width:28px;text-align:center;flex-shrink:0}
.game-hist-name{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game-hist-score{font-family:'Courier New',monospace;font-size:16px;font-weight:800;color:var(--brand);flex-shrink:0}
/* Item / Props */
.item-bar{display:flex;gap:8px;margin-bottom:12px;justify-content:center}
.item-slot{position:relative;width:80px;background:var(--surface);border-radius:var(--radius-md);padding:10px 6px 8px;text-align:center;cursor:pointer;border:2px solid var(--border);transition:all .2s;user-select:none;-webkit-tap-highlight-color:transparent}
.item-slot:active{transform:scale(.93)}
.item-slot.owned{border-color:var(--brand)}
.item-slot.active{border-color:var(--success);box-shadow:0 0 12px rgba(16,185,129,.35);animation:item-glow 1s ease-in-out infinite alternate}
.item-slot.locked{cursor:not-allowed;opacity:.5}
.item-slot .item-icon{font-size:28px;line-height:1;margin-bottom:4px;display:block}
.item-slot .item-name{font-size:10px;font-weight:700;color:var(--text-secondary);line-height:1.2;margin-bottom:2px;display:block}
.item-slot .item-tag{font-size:9px;padding:1px 5px;border-radius:var(--radius-full);display:inline-block;font-weight:600}
.item-tag-free{background:rgba(16,185,129,.15);color:var(--success)}
.item-tag-cost{background:rgba(245,158,11,.15);color:var(--brand)}
.item-tag-event{background:rgba(139,92,246,.15);color:#8B5CF6}
.item-tag-lock{background:rgba(239,68,68,.15);color:var(--danger)}
.item-cd{position:absolute;inset:0;background:rgba(10,14,26,.82);border-radius:calc(var(--radius-md) - 2px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;font-size:13px;font-weight:800;color:var(--brand);font-family:'Courier New',monospace}
.item-cd .cd-icon{font-size:14px;margin-bottom:2px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes item-glow{0%{box-shadow:0 0 8px rgba(16,185,129,.2)}100%{box-shadow:0 0 18px rgba(16,185,129,.5)}}
/* Shock effect */
.shock-overlay{position:fixed;inset:0;z-index:500;pointer-events:none;display:flex;align-items:center;justify-content:center}
.shock-overlay .shock-flash{position:absolute;inset:0;background:radial-gradient(circle at center, rgba(245,158,11,.25), rgba(59,130,246,.12), transparent 70%);animation:shock-flash .45s ease-out forwards}
.shock-overlay .shock-bolt{position:relative;z-index:2;font-size:120px;line-height:1;filter:drop-shadow(0 0 40px rgba(245,158,11,.8)) drop-shadow(0 0 80px rgba(59,130,246,.4));animation:shock-bolt .45s cubic-bezier(.34,1.56,.64,1) forwards;opacity:0}
.shock-overlay .shock-bolt.b2{font-size:80px;left:30%;top:20%;animation-delay:.05s}
.shock-overlay .shock-bolt.b3{font-size:60px;right:25%;bottom:30%;animation-delay:.1s}
@keyframes shock-flash{0%{opacity:1;transform:scale(1)}40%{opacity:.8;transform:scale(1.05)}100%{opacity:0;transform:scale(1.1)}}
@keyframes shock-bolt{0%{opacity:0;transform:scale(.3) rotate(-20deg)}30%{opacity:1;transform:scale(1.2) rotate(5deg)}60%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(.7) rotate(10deg)}}
/* Multiplier badge */
.multi-badge{position:absolute;top:8px;right:8px;z-index:25;background:linear-gradient(135deg,var(--brand),#EF4444);color:#000;font-size:13px;font-weight:900;padding:3px 10px;border-radius:var(--radius-full);font-family:'Courier New',monospace;animation:pop .3s ease-out;box-shadow:0 0 12px rgba(245,158,11,.4)}
/* Watch Device */

// ── Watch Functions ──
let hrTimer=null; // Heart rate timer
let hrValue=72; // Current heart rate

function showWatchNotification(title,body){
  if(!S.watchBound||!S.watchNotifEnabled)return;
  const el=document.getElementById('watchNotif');
  if(!el)return;
  el.querySelector('.wn-title').textContent=title;
  el.querySelector('.wn-body').textContent=body;
  el.querySelector('.wn-time').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}

function startHeartRate(){
  stopHeartRate();
  hrValue=72;
  hrTimer=setInterval(()=>{
    // Simulate heart rate fluctuation (60-140 during game)
    const delta=(Math.random()-0.5)*8;
    hrValue=Math.max(60,Math.min(140,hrValue+delta));
    hrValue=Math.round(hrValue);
    S.watchHeartRate=hrValue;
    updateHeartRateDisplay();
  },1000);
}

function stopHeartRate(){
  if(hrTimer){clearInterval(hrTimer);hrTimer=null}
  hrValue=72;
  S.watchHeartRate=72;
  updateHeartRateDisplay();
}

function updateHeartRateDisplay(){
  const el=document.getElementById('heartRateVal');
  if(el)el.textContent=S.watchHeartRate;
}

function applyWatchCooldownReduction(cd){
  // Watch reduces cooldown by 30%
  if(S.watchBound)return Math.round(cd*0.7);
  return cd;
}

  const summary=`击杀${score}只 · 累计${S.today}只`;

    <h3>'+t('watch.notif_title')+'</h3>

// Watch status sync timer
let watchSyncTimer=null;
function startWatchSync(){
  stopWatchSync();
  watchSyncTimer=setInterval(()=>{
    if(!S.watchBound)return;
    // Simulate watch status update
    S.watchBattery=Math.max(5,S.watchBattery-(Math.random()*0.5));
    S.watchBattery=Math.round(S.watchBattery);
    // Random signal fluctuation
    const sigDelta=(Math.random()-0.5)*3;
    S.watchSignal=String(parseInt(S.watchSignal)+Math.round(sigDelta));
    save();
    // Update device page if open
    const devPage=document.getElementById('page-dev');
    if(devPage&&devPage.style.display!=='none')renderDev();
  },5000); // Update every 5 seconds
}
function stopWatchSync(){
  if(watchSyncTimer){clearInterval(watchSyncTimer);watchSyncTimer=null}
}

function simulateWatchRemote(action){
  // Simulate watch remote control
  if(!S.watchBound){alert('未绑定'+t('dev.watch_name')+'！');return}
  if(action==='start'){
    if(S.sessionActive){alert(t('watch.active_running'));return}
    startSession();
    showWatchNotification(t('watch.remote_start_notif'),t('watch.remote_success'));
    startWatchSync(); // Start status sync
  }else if(action==='stop'){
    if(!S.sessionActive){alert(t('watch.active_idle'));return}
    endSession();
    showWatchNotification(t('watch.remote_stop_notif'),t('watch.remote_success'));
    stopWatchSync(); // Stop status sync
  }else if(action==='toggle'){
    // Toggle session
    if(S.sessionActive){
      endSession();
      showWatchNotification('⏹ 出击模式已停止','手表远程触发成功');
      stopWatchSync();
    }else{
      startSession();
      showWatchNotification('⚡ 出击模式已启动','手表远程触发成功');
      startWatchSync();
    }
  }
}

function compressImage(file,maxWidth,quality){
  maxWidth=maxWidth||600;quality=quality||0.6;
  return new Promise(function(resolve){
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var canvas=document.createElement('canvas');
        var w=img.width,h=img.height;
        if(w>maxWidth){h=Math.round(h*maxWidth/w);w=maxWidth}
        canvas.width=w;canvas.height=h;
        var ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

var uploadingImage=null;

function handleImageUpload(e){
  var file=e.target.files[0];
  if(!file)return;
  if(file.size>10*1024*1024){alert(t('ci.err_image'));return}
  var area=document.getElementById('checkinUploadArea');
  var preview=document.getElementById('checkinPreview');
  if(!area||!preview)return;
  area.classList.add('has-image');
  preview.innerHTML='<div style="padding:20px;color:var(--text-muted)">'+t('ci.compressing')+'</div>';
  compressImage(file,600,0.6).then(function(base64){
    uploadingImage=base64;
    preview.innerHTML='';
    var im=document.createElement('img');
    im.src=base64;im.style.width='100%';im.style.maxHeight='140px';
    im.style.objectFit='cover';im.style.borderRadius='var(--radius-sm)';
    preview.appendChild(im);
    var btn=document.createElement('button');
    btn.className='cp-remove';btn.textContent='✕';
    btn.onclick=function(){uploadingImage=null;area.classList.remove('has-image');preview.innerHTML=''};
    preview.appendChild(btn);
  }).catch(function(){alert(t('ci.err_failed'))});
}

let audioCtx=null;
function playBuzz(){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type='sawtooth';o.frequency.setValueAtTime(200,audioCtx.currentTime);
    o.frequency.linearRampToValueAtTime(600,audioCtx.currentTime+.05);
    g.gain.setValueAtTime(.1,audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+.08);
    o.start();o.stop(audioCtx.currentTime+.08);
  }catch(e){}
}
function playShock(){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    [80,120,200,160,80].forEach((freq,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.connect(g);g.connect(audioCtx.destination);
      o.type='sawtooth';o.frequency.setValueAtTime(freq,audioCtx.currentTime+i*.04);
      o.frequency.linearRampToValueAtTime(freq*2.5,audioCtx.currentTime+i*.04+.06);
      g.gain.setValueAtTime(.13,audioCtx.currentTime+i*.04);
      g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+i*.04+.1);
      o.start(audioCtx.currentTime+i*.04);o.stop(audioCtx.currentTime+i*.04+.1);
    });
  }catch(e){}
}

function getCdRemaining(id){
  const cdEnd=parseInt(localStorage.getItem('mk_itm_cd_'+id))||0;
  return Math.max(0,cdEnd-Date.now());
}
function getEffectiveCd(id){
  const it=ITEMS.find(x=>x.id===id);if(!it)return 0;
  return applyWatchCooldownReduction(it.cd);
}
function startItemCd(id){
  const it=ITEMS.find(x=>x.id===id);if(!it)return;
  const effectiveCd=getEffectiveCd(id);
  const end=Date.now()+effectiveCd;
  localStorage.setItem('mk_itm_cd_'+id,String(end));
  it.cdEnd=end;it.onCd=true;
}
function renderItems(){
  let html='<div class="item-bar">';
  ITEMS.forEach(it=>{
    const owned=it.id==='basic'?true:localStorage.getItem(it.unlockKey)==='1';
    const cdRemain=getCdRemaining(it.id);
    const onCd=cdRemain>0;
    const isActive=G.activeItem===it.id;
    let cls='item-slot';
    if(isActive)cls+=' active';
    else if(!owned)cls+=' locked';
    else if(onCd)cls+=' on-cd';
    else if(owned)cls+=' owned';
    let overlay='';
    if(!owned&&it.id!=='basic'){
      const reason=it.needsDevice?'需绑定实体设备':'需活动获取';
      overlay=`<div class="item-cd"><span style="font-size:20px;margin-bottom:4px">🔒</span><span style="font-size:10px">${reason}</span></div>`;
    }else if(onCd){
      const sec=Math.ceil(cdRemain/1000);
      overlay=`<div class="item-cd"><span class="cd-icon">⏳</span><span>${sec}s</span></div>`;
    }
    html+=`<div class="${cls}" onclick="onItemClick('${it.id}')">
      <span class="item-icon">${it.icon}</span>
      <span class="item-name">${it.name}</span>
      <span class="item-tag ${it.tagClass}">${it.tag}</span>
      ${overlay}
    </div>`;
  });
  html+='</div>';
  return html;
}
function onItemClick(id){
  if(!G.playing){alert('请先开始游戏！');return}
  const it=ITEMS.find(x=>x.id===id);
  if(!it)return;
  const owned=it.id==='basic'?true:localStorage.getItem(it.unlockKey)==='1';
  if(!owned){
    if(it.needsDevice){
      /* Show shop popup for flagship racket */
      openShopPopup('racket');
      return;
    }
    if(it.event){
      /* Show shop popup for limited item */
      openShopPopup('racket');
      return;
    }
    if(it.cost>0){
      if(S.gameHighScore<it.cost){alert('积分不足！需要 '+it.cost+' 分\n当前最高分: '+S.gameHighScore);return}
      if(!confirm('使用 '+it.cost+' 积分兑换【'+it.name+'】？\n（积分按最高记录扣除）'))return;
      localStorage.setItem(it.unlockKey,'1');
      loadItemState();
      alert('🎉 成功兑换【'+it.name+'】！');
      renderGame();return;
    }
    return;
  }
  const cdRemain=getCdRemaining(id);
  if(cdRemain>0){alert('⏳ 【'+it.name+'】冷却中，剩余 '+Math.ceil(cdRemain/1000)+' 秒');return}
  /* Activate */
  activateItem(id);
}
function activateItem(id){
  /* Clear previous */
  clearItemEffect();
  const it=ITEMS.find(x=>x.id===id);
  if(!it)return;
  G.activeItem=id;
  G.multiplier=it.mult;
  /* Visual: multiplier badge */
  const board=document.getElementById('gameBoard');
  if(board){
    let b=board.querySelector('.multi-badge');
    if(!b){b=document.createElement('div');b.className='multi-badge';board.appendChild(b)}
    b.textContent='×'+it.mult;
    b.style.display='block';
  }
  /* Shock effect for advanced/limited/flagship */
  if(it.effect!=='single')showShockEffect(it);
  /* Watch联动：使用道具通知 */
  if(S.watchBound){
    showWatchNotification('⚡ 道具激活',it.name+' 已激活，倍率×'+it.mult);
  }
  /* Start cooldown after effect duration */
  const effectDuration=it.effect==='clear'?600:it.effect==='aoe2'?500:400;
  setTimeout(()=>{
    if(G.activeItem===id){
      startItemCd(id);
      clearItemEffect();
      renderGame();
    }
  },effectDuration);
  /* Auto-clear after effect */
  G.itemTimer=setTimeout(()=>{clearItemEffect()},effectDuration);
  renderGame();
}
function clearItemEffect(){
  G.activeItem=null;
  G.multiplier=1;
  const board=document.getElementById('gameBoard');
  if(board){
    const b=board.querySelector('.multi-badge');
    if(b)b.remove();
  }
  if(G.itemTimer){clearTimeout(G.itemTimer);G.itemTimer=null}
}
function showShockEffect(it){
  const board=document.getElementById('gameBoard');if(!board)return;
  const overlay=document.createElement('div');
  overlay.className='shock-overlay';
  overlay.id='shockOverlay';
  const flash=document.createElement('div');
  flash.className='shock-flash';
  overlay.appendChild(flash);
  /* Add bolt icons */
  const bolts=[it.icon,it.icon,it.icon];
  bolts.forEach((ic,i)=>{
    const b=document.createElement('div');
    b.className='shock-bolt'+(i===1?' b2':'')+(i===2?' b3':'');
    b.textContent=ic;
    overlay.appendChild(b);
  });
  board.appendChild(overlay);
  playShock();
  setTimeout(()=>{if(overlay.parentNode)overlay.remove()},600);
  /* Apply kill effect based on type */
  if(it.effect==='clear'){
    /* Full clear: kill all mosquitoes on screen */
    setTimeout(()=>{
      const copy=[...G.mosquitoes];
      copy.forEach(m=>{
        if(m.el&&!m.el.classList.contains('killed')){
          killMosquito(m.id,m.x,m.y,true);
        }
      });
    },120);
  }
}

// ── Badges ──
function getBadgeProgress(b){
  // Returns {cur, pct} for the badge's progress
  const tier=b.progressKey;
  let cur=0;
  if(tier==='season') cur=S.season;
  else if(tier==='gameHighScore') cur=S.gameHighScore;
  else if(tier==='nightKills') cur=S.nightKills;
  else if(tier==='weeklyTopThree') cur=S.weeklyTopThree;
  else if(tier==='seasonChamp') cur=S.seasonChamp;
  const pct=b.ok?100:Math.min(100,Math.round(cur/b.target*100));
  return {cur:Math.min(cur,b.target),pct};
}

function renderBadges(){
  const el=document.getElementById('page-badges');if(!el)return;
  const tc={bronze:'tag-bronze',silver:'tag-silver',gold:'tag-gold',legend:'tag-legend'};
  const tn={bronze:'🥉铜',silver:'🥈银',gold:'🥇金',legend:'👑传说'};
  const unlocked=S.unlockedBadges||[];
  const unlockedCount=BADGES.filter(b=>b.ok||unlocked.includes(b.id)).length;
  const allUnlocked=unlockedCount>=BADGES.length;

  let allStarHtml='';
  if(allUnlocked){
    allStarHtml='<div class="badge-all-star"><div class="as-icon">✨</div><div class="as-title">'+t('badge.master_title')+'</div><div class="as-sub">'+t('badge.master_sub')+'</div></div>';
  }

  const countBarHtml='<div class="badge-count-bar"><span class="bcb-left">'+t('badge.unlocked')+'</span><span class="bcb-right">'+unlockedCount+' / '+BADGES.length+'</span></div>';

  const badgeCards=BADGES.map(function(b){
    const isUnlocked=b.ok||unlocked.includes(b.id);
    const prog=getBadgeProgress(b);
    const showProgress=!isUnlocked;
    const progressHtml=showProgress?'<div class="badge-progress-label">'+prog.cur+' / '+b.target+'</div><div class="badge-progress-wrap"><div class="badge-progress-bar tier-'+b.tier+'" style="width:'+prog.pct+'%"></div></div>':'';
    const condHtml=!isUnlocked?'<div class="badge-cond">'+b.cond+'</div>':'';
    const dateHtml=isUnlocked&&b.date?'<div style="font-size:9px;color:var(--success);margin-top:2px">'+b.date+'</div>':'';
    return '<div class="badge-card '+(isUnlocked?'':'locked')+'" data-badge-id="'+b.id+'" data-unlocked="'+(isUnlocked?'1':'0')+'">'+
      '<div class="badge-icon">'+b.icon+'</div>'+
      '<div class="badge-name">'+b.name+'</div>'+
      '<span class="tag '+tc[b.tier]+'">'+tn[b.tier]+'</span>'+
      dateHtml+progressHtml+condHtml+
      '</div>';
  }).join('');

  el.innerHTML=allStarHtml+countBarHtml+'<div class="badge-grid">'+badgeCards+'</div>';

  // Event delegation for badge click (avoid inline onclick)
  el.querySelectorAll('.badge-card').forEach(function(card){
    card.addEventListener('click',function(){
      const id=card.getAttribute('data-badge-id');
      const isUnlocked=card.getAttribute('data-unlocked')==='1';
      showBadge(id,isUnlocked);
    });
  });
}

function showBadge(id,isUnlocked){
  const b=BADGES.find(x=>x.id===id);if(!b)return;
  const tc={bronze:'tag-bronze',silver:'tag-silver',gold:'tag-gold',legend:'tag-legend'};
  const tn={bronze:'铜牌',silver:'银牌',gold:'金牌',legend:'传说'};
  const m=document.getElementById('modal'),box=document.getElementById('modalBox');
  if(!m||!box)return;
  const prog=getBadgeProgress(b);
  const unlocked=isUnlocked===undefined?(b.ok||(S.unlockedBadges||[]).includes(b.id)):isUnlocked;
  const progressSection=!unlocked?'<div style="margin:10px 0 4px;font-size:12px;color:var(--text-muted)">'+t('badge.progress')+''+prog.cur+' / '+b.target+'</div><div class="badge-progress-wrap" style="height:6px;margin:4px 0 12px"><div class="badge-progress-bar tier-'+b.tier+'" style="width:'+prog.pct+'%"></div></div>':'';
  const statusSection=unlocked?'<p style="font-size:12px;color:var(--success);margin-bottom:12px">✅ '+t('badge.unlocked_time')+''+(b.date||'已获得')+'</p>':'<p style="font-size:12px;color:var(--text-muted);margin-bottom:4px">'+t('badge.unlock_cond')+''+b.cond+'</p>';
  box.innerHTML='<div class="modal-icon">'+b.icon+'</div>'+
    '<h3 style="margin-bottom:6px">'+b.name+'</h3>'+
    '<span class="badge-unlock-tier '+tc[b.tier]+'">'+tn[b.tier]+'</span>'+
    '<p style="font-size:13px;color:var(--text-secondary);margin:10px 0 8px">'+b.desc+'</p>'+
    statusSection+progressSection+
    '<button class="modal-close" onclick="closeModal()" style="margin-top:4px">知道了</button>';
  m.classList.add('show');
}
function closeModal(){const m=document.getElementById('modal');if(m)m.classList.remove('show')}

function showBadgeUnlockPopup(b,onClose){
  const tc={bronze:'tag-bronze',silver:'tag-silver',gold:'tag-gold',legend:'tag-legend'};
  const tn={bronze:'🥉 铜牌',silver:'🥈 银牌',gold:'🥇 金牌',legend:'👑 传说'};
  // Remove existing popup if any
  const existing=document.getElementById('badgeUnlockOverlay');
  if(existing)existing.remove();
  const overlay=document.createElement('div');
  overlay.id='badgeUnlockOverlay';
  overlay.className='badge-unlock-overlay';
  const popup=document.createElement('div');
  popup.className='badge-unlock-popup';
  popup.innerHTML='<span class="badge-unlock-icon">'+b.icon+'</span>'+
    '<div class="badge-unlock-title">'+t('badge.unlock_excl')+'</div>'+
    '<div class="badge-unlock-name">'+b.name+'</div>'+
    '<span class="badge-unlock-tier '+tc[b.tier]+'">'+tn[b.tier]+'</span>'+
    '<p style="font-size:12px;color:var(--text-secondary);margin:10px 0 14px">'+b.desc+'</p>'+
    '<button class="badge-unlock-btn" id="badgeUnlockOk">'+t('badge.unlock_btn')+'</button>';
  overlay.appendChild(popup);
  document.body.appendChild(overlay);
  document.getElementById('badgeUnlockOk').addEventListener('click',function(){
    overlay.remove();
    if(onClose)onClose();
  });
  // Auto close after 5s
  setTimeout(function(){if(overlay.parentNode){overlay.remove();if(onClose)onClose();}},5000);
}

function checkBadges(onDone){
  // Check each badge condition, unlock if newly met
  const unlocked=S.unlockedBadges||[];
  const queue=[];
  const now=new Date();
  const nowStr=now.getFullYear()+'-'+(String(now.getMonth()+1).padStart(2,'0'))+'-'+(String(now.getDate()).padStart(2,'0'));

  BADGES.forEach(function(b){
    if(b.ok||unlocked.includes(b.id))return; // already unlocked
    let met=false;
    if(b.progressKey==='season' && S.season>=b.target) met=true;
    else if(b.progressKey==='gameHighScore' && S.gameHighScore>=b.target) met=true;
    else if(b.progressKey==='nightKills' && S.nightKills>=b.target) met=true;
    else if(b.progressKey==='weeklyTopThree' && S.weeklyTopThree>=b.target) met=true;
    else if(b.progressKey==='seasonChamp' && S.seasonChamp>=b.target) met=true;
    if(met){
      unlocked.push(b.id);
      b.ok=true;
      b.date=nowStr;
      queue.push(b);
      // 手表联动：解锁勋章时推送通知
      if(S.watchBound){
        showWatchNotification(t('watch.badge_notif_title'), t('watch.badge_notif_body')+b.name+'】');
      }
    }
  });

  if(queue.length>0){
    S.unlockedBadges=unlocked;
    save();
    renderBadges();

    let i=0;

    showNext();
  } else {

}

function startGame(){
  stopGame();
  G={playing:true,score:0,timeLeft:10,mosquitoes:[],timer:null,spawnTimer:null,nextId:1,activeItem:null,multiplier:1,itemTimer:null,
     mode:gameMode,opponentScore:0,opponentTimer:null};
  const board=document.getElementById('gameBoard');if(!board)return;
  const overlay=board.querySelector('.game-overlay');
  if(overlay)overlay.remove();
  board.classList.add('playing');
  updateGameHUD();
  G.timer=setInterval(gameTick,1000);
  scheduleSpawn();
  // Watch联动：启动心率模拟，发送通知
  if(S.watchBound){
    startHeartRate();
    showWatchNotification(t('game.watch_start'),t('game.watch_start_desc'));
  }
  // PK mode: start opponent AI
  if(G.mode==='pk'){startOpponentAI();}
}
function stopGame(){
  if(G.timer){clearInterval(G.timer);G.timer=null}
  if(G.spawnTimer){clearTimeout(G.spawnTimer);G.spawnTimer=null}
  if(G.opponentTimer){clearInterval(G.opponentTimer);G.opponentTimer=null}
  G.mosquitoes.forEach(m=>{const e=document.getElementById('mq-'+m.id);if(e)e.remove()});
  G.playing=false;
}
function gameTick(){
  if(!G.playing)return;
  G.timeLeft--;
  updateGameHUD();
  if(G.timeLeft<=0){endGame();return}
}
function scheduleSpawn(){
  if(!G.playing)return;
  const elapsed=10-G.timeLeft;
  let interval=Math.max(180,900-elapsed*80);
  // 手表绑定后，蚊子生成速度提升20%（间隔减少20%）
  if(S.watchBound){
    interval=Math.round(interval*0.8);
  }
  G.spawnTimer=setTimeout(()=>{spawnMosquito();scheduleSpawn()},interval);
}
function spawnMosquito(){
  if(!G.playing)return;
  const board=document.getElementById('gameBoard');if(!board)return;
  const id=G.nextId++;
  const margin=40;
  const bw=board.clientWidth,bh=board.clientHeight;
  const x=margin+Math.random()*(bw-2*margin);
  const y=margin+Math.random()*(bh-2*margin);
  const el=document.createElement('div');
  el.id='mq-'+id;
  el.className='game-mosq';
  el.textContent='🦟';
  el.style.left=x+'px';el.style.top=y+'px';
  el.onclick=function(e){e.stopPropagation();killMosquito(id,x,y)};
  board.appendChild(el);
  G.mosquitoes.push({id,x,y,el});
  setTimeout(()=>{autoRemoveMosquito(id)},2200);
}
function autoRemoveMosquito(id){
  const idx=G.mosquitoes.findIndex(m=>m.id===id);
  if(idx===-1)return;
  const m=G.mosquitoes[idx];
  if(m.el&&!m.el.classList.contains('killed')){
    m.el.style.opacity='0';m.el.style.transform='scale(.5)';m.el.style.transition='all .3s';
    setTimeout(()=>{if(m.el)m.el.remove()},300);
  }
  G.mosquitoes.splice(idx,1);
}
function killMosquito(id,x,y,fromClear){
  const idx=G.mosquitoes.findIndex(m=>m.id===id);
  if(idx===-1)return;
  const m=G.mosquitoes[idx];
  if(!fromClear)m.el.classList.add('killed');
  setTimeout(()=>{if(m.el&&!fromClear)m.el.remove()},350);
  G.mosquitoes.splice(idx,1);
  const pts=G.multiplier||1;
  G.score+=pts;
  updateGameHUD();
  if(!fromClear){
    if(pts>1){showMultiFX(x,y,pts)}
    else{playBuzz();showKillFX(x,y)}
  }
  /* AOE: advanced / limited */
  if(G.activeItem==='advanced'&&!fromClear){
    doAOE(x,y,100);
  }else if(G.activeItem==='limited'&&!fromClear){
    doAOE(x,y,160);
  }
}
function doAOE(cx,cy,radius){
  const toKill=[];
  G.mosquitoes.forEach(function(mm){
    if(mm.el&&!mm.el.classList.contains('killed')){
      const dx=mm.x-cx,dy=mm.y-cy;
      if(Math.sqrt(dx*dx+dy*dy)<radius)toKill.push(mm);
    }
  });
  toKill.forEach(function(mm){
    if(mm.el)mm.el.classList.add('killed');
    const pts=G.multiplier||1;
    G.score+=pts;
    if(pts>1)showMultiFX(mm.x,mm.y,pts);
    else showKillFX(mm.x,mm.y);
    setTimeout(function(){if(mm.el)mm.el.remove()},300);
  });
  for(let i=G.mosquitoes.length-1;i>=0;i--){
    if(toKill.indexOf(G.mosquitoes[i])!==-1)G.mosquitoes.splice(i,1);
  }
  updateGameHUD();
  playShock();
}
function showMultiFX(x,y,pts){
  const board=document.getElementById('gameBoard');if(!board)return;
  const fx=document.createElement('div');
  fx.className='game-kill-fx';
  fx.textContent='+'+pts;
  fx.style.left=x+'px';fx.style.top=y+'px';
  fx.style.fontSize='22px';
  board.appendChild(fx);
  setTimeout(()=>fx.remove(),700);
  playBuzz();
}
function showKillFX(x,y){
  const board=document.getElementById('gameBoard');if(!board)return;
  const fx=document.createElement('div');
  fx.className='game-kill-fx';
  fx.textContent='+1';
  fx.style.left=x+'px';fx.style.top=y+'px';
  board.appendChild(fx);
  setTimeout(()=>fx.remove(),700);
}
function endGame(){
  clearItemEffect();G.playing=false;
  if(G.timer){clearInterval(G.timer);G.timer=null}
  if(G.spawnTimer){clearTimeout(G.spawnTimer);G.spawnTimer=null}
  G.mosquitoes.forEach(m=>{if(m.el)m.el.remove()});
  G.mosquitoes=[];
  const board=document.getElementById('gameBoard');
  if(board)board.classList.remove('playing');
  const isNewHigh=G.score>S.gameHighScore;
  if(isNewHigh){S.gameHighScore=G.score;localStorage.setItem('mk_ghs',G.score);}

  const h=new Date().getHours();
  if(h>=22||h<6){S.nightKills+=G.score;save();}
  // Watch联动：停止心率模拟，发送通知，显示战绩简报
  if(S.watchBound){

    if(isNewHigh){
      showWatchNotification(t('game.watch_new_record'),t('game.watch_new_record_desc')+G.score+t('misc.kills_unit'));

    }

  checkBadges(function(){/* after badges */});
  // PK模式：显示PK结果弹窗
  if(G.mode==='pk'){showPKResult();return;}
  renderGame();
}

function startOpponentAI(){
  if(!G.playing || G.mode!=='pk')return;
  // Simulate opponent killing mosquitoes with random delay
  const delay=800+Math.random()*1500;
  G.opponentTimer=setTimeout(function(){
    if(!G.playing || G.mode!=='pk')return;
    G.opponentScore++;
    updatePKHUD();
    startOpponentAI(); // recurse
  },delay);
}
function updatePKHUD(){
  const myBar=document.querySelector('.pk-bar-my > div');
  const oppBar=document.querySelector('.pk-bar-opp > div');
  const myScore=document.querySelector('.pk-score');
  const oppScore=document.querySelector('.pk-score-opp');
  if(myBar&&oppBar){
    const total=G.score+G.opponentScore+1;
    myBar.style.width=Math.max(5,G.score/total*100)+'%';
    oppBar.style.width=Math.max(5,G.opponentScore/total*100)+'%';
  }
  if(myScore)myScore.textContent=G.score;
  if(oppScore)oppScore.textContent=G.opponentScore;
}
function showPKResult(){
  const m=document.getElementById('modal'),box=document.getElementById('modalBox');
  if(!m||!box)return;
  let result='',comment='',fun='';
  if(G.score>G.opponentScore){result='win';S.pkWins++;comment=t('game.win');fun=t('game.win_comment');}
  else if(G.score<G.opponentScore){result='lose';S.pkLosses++;comment=t('game.lose');fun=t('game.lose_comment');}
  else{result='draw';S.pkDraws++;comment=t('game.draw');fun=t('game.draw_comment');}
  S.pkTotal++;
  S.pkWinRate=Math.round(S.pkWins/S.pkTotal*100);
  const now=new Date();
  const nowStr=now.getFullYear()+'-'+(String(now.getMonth()+1).padStart(2,'0'))+'-'+(String(now.getDate()).padStart(2,'0'));
  S.pkHistory.push({d:nowStr,s:G.score,o:G.opponentScore,r:result});
  if(S.pkHistory.length>50)S.pkHistory=S.pkHistory.slice(-50);
  save();
  const resultColor=result==='win'?'var(--success)':result==='lose'?'var(--danger)':'var(--warning)';
  const resultIcon=result==='win'?'🏆':result==='lose'?'😢':'🤝';

    p.tags.forEach(function(t){badgeHtml+='<span class="sc-tag">'+t+'</span>';});
    html+='<div class="shop-card" data-pid="'+pid+'"><div class="sc-img">'+p.icon+'</div><div class="sc-name">'+p.name+'</div><div class="sc-desc">'+p.desc+'</div><div class="sc-tags">'+badgeHtml+'</div><div class="sc-price-row"><span class="sc-price">¥<span class="yen">'+formatPrice(p.price)+'</span></span><span class="sc-orig-price">¥'+formatPrice(p.origPrice)+'</span></div><button class="sc-btn" data-buy="'+pid+'">🛒 立即购买</button></div>';
  });
  return html;
}

function renderShopBundle(){
  let html='';
  const bundles=['bundle_rw','bundle_rr','bundle_all'];
  bundles.forEach(function(bid){
    const p=SHOP_PRODUCTS[bid];if(!p)return;
    let badgeHtml='';
    p.tags.forEach(function(t){badgeHtml+='<span class="sc-tag">'+t+'</span>';});
    let itemsHtml='<div class="bc-items">';
    if(p.bundleItems){
      p.bundleItems.forEach(function(iid){
        const item=SHOP_PRODUCTS[iid];if(item)itemsHtml+='<div class="bc-item"><div class="bc-item-icon">'+item.icon+'</div><div class="bc-item-name">'+item.name+'</div></div>';
      });
    }
    itemsHtml+='</div>';
    html+='<div class="bundle-card" data-bid="'+bid+'"><div class="bc-badge">'+(p.tags[0]||'')+'</div><div class="bc-title">'+p.name+'</div><div class="bc-desc">'+p.desc+'</div>'+itemsHtml+'<div class="bc-price-row"><span class="bc-price">¥<span class="yen">'+formatPrice(p.price)+'</span></span><span class="bc-orig">¥'+formatPrice(p.origPrice)+'</span><span class="bc-save">'+t('shop.save')+'¥'+formatPrice(p.saveAmount)+'</span></div><button class="bc-btn" data-buy="'+bid+'">🛒 立即购买</button></div>';
  });
  return html;
}

// ── Shop event delegation (avoid inline onclick escaping issues)
document.addEventListener('click', function(e){
  var t=e.target;
  // Shop card click -> open popup
  var card=t.closest('.shop-card');
  if(card && !t.hasAttribute('data-buy')){
    openShopPopup(card.getAttribute('data-pid'));return;
  }
  // Buy button click
  var buyBtn=t.closest('[data-buy]');
  if(buyBtn){
    e.stopPropagation();
    goBuy(buyBtn.getAttribute('data-buy'));return;
  }
  // Bundle card click
  var bc=t.closest('.bundle-card');
  if(bc && !t.hasAttribute('data-buy')){
    openShopPopup(bc.getAttribute('data-bid'));return;
  }
});

// ── Init ──
render();
</script>
</body>
</html>
